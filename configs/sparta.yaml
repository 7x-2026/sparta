project:
  name: sparta_full
  root_dir: .
  output_dir: results/sparta
  checkpoint_dir: checkpoints/sparta
  log_dir: logs/sparta

seed: 42

data:
  mode: full
  base_dir: data/sparta_dataset
  input_window: 12
  pred_horizon: 5
  max_nodes: 8
  max_links: 12
  node_feat_dim: 8
  link_feat_dim: 8
  service_feat_dim: 5
  sla_feat_dim: 5

model:
  name: sparta
  hidden_dim: 128
  temporal_layers: 2
  topology_layers: 2
  n_heads: 4
  ffn_dim: 512
  dropout: 0.1
  use_sla_gate: true
  use_topology: true
  use_attribution: true

loss:
  risk_loss: ce
  lambda_node: 0.3
  lambda_link: 0.3
  lambda_metric: 0.2
  ignore_index: -100

train:
  batch_size: 64
  epochs: 100
  lr: 0.0005
  weight_decay: 0.0001
  grad_clip: 1.0
  num_workers: 0
  device: auto
  best_metric: macro_f1
