  base_dir: F:\7x\SPARTA\run\20260609_005_synthetic_full
  raw_logs_dir: F:\7x\SPARTA\run\20260609_005_synthetic_full\raw_logs
  processed_dir: F:\7x\SPARTA\run\20260609_005_synthetic_full\processed
  dataset_dir: F:\7x\SPARTA\run\20260609_005_synthetic_full\dataset
  input_window: 12
  pred_horizon: 5
  max_nodes: 8
  max_links: 12
  node_feat_dim: 8
  link_feat_dim: 8
  service_feat_dim: 5
  sla_feat_dim: 5
  num_nodes: 8
  num_links: 12
  num_edge_nodes: 5
  num_access_nodes: 2
  num_users: 300
  num_services: 80
  num_steps: 1000
  train_ratio: 0.6
  val_ratio: 0.2
  test_ratio: 0.2
  train_path: F:\7x\SPARTA\run\20260609_005_synthetic_full\dataset\train.pkl
  val_path: F:\7x\SPARTA\run\20260609_005_synthetic_full\dataset\val.pkl
  test_path: F:\7x\SPARTA\run\20260609_005_synthetic_full\dataset\test.pkl
  metadata_path: F:\7x\SPARTA\run\20260609_005_synthetic_full\dataset\metadata.json
simulation:
  topology: synthetic_full_v0
  scenario_schedule: interleaved
  max_scenario_ratio_per_split: 0.4
  max_attribution_majority_ratio: 0.5
  target_label_ratio:
    normal: 0.45
    risky: 0.35
    violated: 0.2
  allowed_label_ratio_range:
    normal:
    - 0.35
    - 0.55
    risky:
    - 0.25
    - 0.45
    violated:
    - 0.1
    - 0.3
  split_balance_check:
    enabled: true
    max_label_ratio_gap: 0.15
    max_scenario_ratio_per_split: 0.4
    max_top_node_attr_ratio: 0.5
    max_top_link_attr_ratio: 0.5
    min_metric_ratio:
      queue: 0.05
  generation_retry:
    enabled: true
    max_retries: 20
  scenarios:
  - normal
  - burst
  - node_overload
  - link_congestion
  - mixed
  delay_cap_ms: 300.0
  bandwidth_cap: 100.0
  queue_cap: 50.0
  queue_metric_cap: 28.0
  queue_growth_cap: 8.0
  min_queue_metric_ratio_per_split: 0.05
  request_cap: 100.0
  response_cap_ms: 420.0
model:
  name: sparta
  hidden_dim: 32
  temporal_layers: 1
  topology_layers: 1
  n_heads: 2
  ffn_dim: 128
  dropout: 0.1
  use_sla_gate: true
  use_topology: true
  use_attribution: true
loss:
  risk_loss: ce
  lambda_node: 0.3
  lambda_link: 0.3
  lambda_metric: 0.2
  ignore_attribution_for_normal: true
  ignore_index: -100
train:
  batch_size: 64
  epochs: 1
  lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  num_workers: 0
  device: auto
  best_metric: macro_f1
  checkpoint_name: '{model}_best.pth'
validation:
  require_all_classes: true
  min_risky_violated_ratio: 0.2
  min_samples_per_class: 5
